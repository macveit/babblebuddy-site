function setLanguage(lang) {
  const selected = translations[lang] ? lang : 'de';
  const t = translations[selected];
  document.documentElement.lang = selected === 'en' ? 'en' : 'de';
  document.title = t.title || document.title;
  const meta = document.querySelector('meta[name="description"]');
  if (meta && t.description) meta.setAttribute('content', t.description);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('.lang-button').forEach(button => {
    button.classList.toggle('active', button.dataset.lang === selected);
    button.setAttribute('aria-pressed', button.dataset.lang === selected ? 'true' : 'false');
  });
  localStorage.setItem('babbblebuddy-language', selected);
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('babbblebuddy-language');
  const browser = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'de';
  setLanguage(saved || browser);
  document.querySelectorAll('.lang-button').forEach(button => {
    button.addEventListener('click', () => setLanguage(button.dataset.lang));
  });
});
</script>
